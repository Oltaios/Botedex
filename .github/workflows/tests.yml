# Workflow CI : exécute les tests de non-régression (npm test) sur chaque
# pull request (check exigé par la protection de branche) et sur les push
# directs sur main, pour tester le commit de fusion (nouveau SHA jamais
# testé par la PR). Les push sur les autres branches (dev, features) ne
# déclenchent rien : la PR porte sur le même commit, un run de plus
# serait un doublon.
# Aucun secret requis : les tests utilisent des variables factices
# (cf. tests/helpers/env.mjs) et MongoDB en mémoire.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Mise en place de Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Le binaire mongod de mongodb-memory-server (~70 Mo) n'est pas couvert
      # par le cache npm : sans ce cache, chaque run le retélécharge.
      # Incrémenter le suffixe de la clé pour forcer un nouveau téléchargement.
      - name: Cache du binaire MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-ubuntu-v1

      - name: Installation des dépendances (package-lock)
        run: npm ci

      - name: Tests
        # Sérialisés : chaque test d'intégration démarre son propre mongod ;
        # en parallèle sur un runner 2 vCPU, les démarrages peuvent entrer
        # en contention et faire échouer la suite de façon aléatoire.
        run: node --test --test-concurrency=1 tests/
